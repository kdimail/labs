---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  wait: false
  timeout: 15m
  
  path: ./contoso/flux/platform-services/overlays/shared-non-prod
  
  dependsOn:
    - name: infrastructure
    - name: operators
  
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-config
        optional: false
  
  sourceRef:
    kind: GitRepository
    name: shared-non-prod-flux
    namespace: flux-system

