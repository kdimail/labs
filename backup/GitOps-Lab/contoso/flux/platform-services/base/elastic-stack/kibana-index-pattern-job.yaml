apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-create-index-pattern
  namespace: elastic-stack
  labels:
    app: kibana-setup
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: kibana-setup
    spec:
      restartPolicy: OnFailure
      
      initContainers:
        # Wait for Kibana to be ready
        - name: wait-for-kibana
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kibana to be ready..."
              until curl -k -u "elastic:$(printenv ELASTIC_PASSWORD)" -s "https://production-kb-kb-http.elastic-stack.svc:5601/api/status" | grep -q '"level":"available"'; do
                echo "Kibana not ready yet, waiting..."
                sleep 10
              done
              echo "Kibana is ready!"
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: production-es-es-elastic-user
                  key: elastic
      
      containers:
        - name: create-index-pattern
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "Creating Kibana index pattern for logstash-*..."
              
              # Create data view (index pattern) for logstash-*
              RESPONSE=$(curl -k -u "elastic:$(printenv ELASTIC_PASSWORD)" \
                -X POST "https://production-kb-kb-http.elastic-stack.svc:5601/api/data_views/data_view" \
                -H "kbn-xsrf: true" \
                -H "Content-Type: application/json" \
                -d '{
                  "data_view": {
                    "title": "logstash-*",
                    "timeFieldName": "@timestamp",
                    "name": "Logstash Logs"
                  }
                }' -w "\n%{http_code}")
              
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | sed '$d')
              
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "409" ]; then
                echo "Index pattern created successfully or already exists"
                echo "Response: $BODY"
              elif [ "$HTTP_CODE" = "400" ] && echo "$BODY" | grep -q "Duplicate"; then
                echo "Index pattern already exists (duplicate), continuing..."
              else
                echo "Failed to create index pattern. HTTP Code: $HTTP_CODE"
                echo "Response: $BODY"
                exit 1
              fi
              
              echo "Setting logstash-* as default index pattern..."
              
              # Get the data view ID from the response or list
              DATA_VIEW_ID=$(curl -k -u "elastic:$(printenv ELASTIC_PASSWORD)" -s \
                "https://production-kb-kb-http.elastic-stack.svc:5601/api/data_views" \
                -H "kbn-xsrf: true" | grep -o '"id":"[^"]*logstash[^"]*"' | head -1 | cut -d'"' -f4)
              
              if [ -n "$DATA_VIEW_ID" ]; then
                curl -k -u "elastic:$(printenv ELASTIC_PASSWORD)" \
                  -X POST "https://production-kb-kb-http.elastic-stack.svc:5601/api/data_views/default" \
                  -H "kbn-xsrf: true" \
                  -H "Content-Type: application/json" \
                  -d "{\"data_view_id\": \"$DATA_VIEW_ID\", \"force\": true}"
                
                echo "Default index pattern set to logstash-*"
              else
                echo "Warning: Could not find data view ID, skipping default setting"
              fi
              
              echo "Kibana index pattern setup completed!"
          
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: production-es-es-elastic-user
                  key: elastic
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
