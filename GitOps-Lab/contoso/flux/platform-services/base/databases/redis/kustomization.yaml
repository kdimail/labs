---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Helm-based deployment using DandyDeveloper redis-ha chart
# NO HARDCODED SECRETS - All sensitive values from Azure Key Vault
# HelmRepository and HelmRelease in flux-system
# Resources deployed to redis namespace

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - values.yaml
  - externalsecret.yaml

