---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contoso-postgres-secret
  namespace: contoso
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: contoso-postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: contoso-password
      remoteRef:
        key: shared-nonprod-contoso-postgres-password
