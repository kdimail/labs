apiVersion: v1
kind: ConfigMap
metadata:
  name: logistics-api-config
  namespace: contoso
  labels:
    app: contoso-logistics-backend
    service: logistics
data:
  CommandTelemetry__ActivitySourceName: Logistics.Commands
  CommandTelemetry__MeterName: Logistics.Commands
  CommandTelemetry__MeterVersion: "1.0.0"
  ElasticApm__ServiceName: Contoso.Logistics.Backend
  Logging__LogLevel__Contoso.Logistics.Backend: Debug
  OpenTelemetry__ServiceName: Contoso.Logistics.Backend
  Pagination__DefaultPageSize: "50"
  Pagination__MaxPageSize: "1000"
  Performance__CommandTimeout: "30"
  Performance__MaxRetryCount: "3"
  Performance__QueryTimeout: "180"
  Serilog__InfluxDb__ApplicationName: logisticsService
  Serilog__InfluxDb__InstanceName: production
  ServiceName: Contoso.Logistics.Backend.Api
  Serilog__MinimumLevel__Override__Contoso.Logistics.Backend.Api: Debug
  Serilog__MinimumLevel__Override__Contoso.Logistics.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.Logistics.Backend.Infrastructure: Debug
  Serilog__MinimumLevel__Override__Contoso.Logistics.Backend.API: Debug
  Cache__logisticsDetails__TTL: '300'
  Cache__logisticsHeaders__TTL: '300'
  Cache__Suppliers__TTL: '3600'
  ExportOptions__DefaultDomainName: logistics
  Export__AllowedDomains__0: logistics
  Export__AllowedDomains__1: api
  Export__EnableCsvExport: 'true'
  Export__EnableExcelExport: 'true'
  Export__EnablePdfExport: 'true'
  Export__MaxExportSize: '50000'
  FeatureFlags__EnableAdvancedFiltering: 'true'
  FeatureFlags__EnableBulkOperations: 'true'
  FeatureFlags__EnableExport: 'true'
  FeatureFlags__EnablePromiseDateAudit: 'true'
  ServiceBus__QueueName: excel-export-queue
