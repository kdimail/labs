name: Print secrets

on:
  workflow_call:

jobs:
  deploy:
    runs-on: [self-hosted, "Region:il"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Save secrets to JSON file
        run: |
          $secretsJson = '${{ toJSON(secrets) }}'
          Set-Content -Path "secrets.json" -Value $secretsJson
          Write-Host "Secrets saved to secrets.json"
        shell: pwsh