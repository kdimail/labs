---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  serviceAccountName: sonarqube
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: sonarqube
      version: "2025.1.0"  # SonarQube 2025.1 LTA
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: sonarqube
      interval: 87600h
  
  targetNamespace: sonarqube
  
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 15m
  
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
    timeout: 15m
  
  # Reference to ConfigMap containing values
  valuesFrom:
    - kind: ConfigMap
      name: sonarqube-values
      valuesKey: values.yaml
