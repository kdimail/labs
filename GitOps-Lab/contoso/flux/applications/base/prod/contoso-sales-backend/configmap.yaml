apiVersion: v1
kind: ConfigMap
metadata:
  name: sales-api-config
  namespace: contoso
  labels:
    app: contoso-sales-backend
    service: sales
data:
  CommandTelemetry__ActivitySourceName: Sales.Commands
  CommandTelemetry__MeterName: Sales.Commands
  CommandTelemetry__MeterVersion: "1.0.0"
  ElasticApm__ServiceName: Contoso.Sales.Backend
  Logging__LogLevel__Contoso.Sales.Backend: Debug
  OpenTelemetry__ServiceName: Contoso.Sales.Backend.Api
  Pagination__DefaultPageSize: "50"
  Pagination__MaxPageSize: "1000"
  Performance__CommandTimeout: "30"
  Performance__MaxRetryCount: "3"
  Performance__QueryTimeout: "180"
  Serilog__InfluxDb__ApplicationName: salesService
  Serilog__InfluxDb__InstanceName: production
  ServiceName: Contoso.Sales.Backend.Api
  Serilog__MinimumLevel__Override__Contoso.Sales.Backend.Api: Information
  Serilog__MinimumLevel__Override__Contoso.Sales.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.Sales.Backend.Infrastructure: Debug
  Cache__Suppliers__TTL: '3600'
  ExportOptions__DefaultDomainName: sales
  Export__AllowedDomains__0: sales
  Export__AllowedDomains__1: api
  Export__EnableCsvExport: 'true'
  Export__EnableExcelExport: 'true'
  Export__EnablePdfExport: 'true'
  Export__MaxExportSize: '50000'
  FeatureFlags__EnableAdvancedFiltering: 'true'
  FeatureFlags__EnableBulkOperations: 'true'
  FeatureFlags__EnableExport: 'true'
  FeatureFlags__EnablePromiseDateAudit: 'true'
  Serilog__MinimumLevel__Override__Contoso.Workspace.Backend.Api: Debug
  ServiceBus__QueueName: excel-export-queue
