---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-secret
  namespace: flux-system
spec:
  # Refresh interval - how often to check for updates in Key Vault
  refreshInterval: 5m
  
  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  
  # Target secret to create in Kubernetes with Helm values format
  target:
    name: headlamp-oidc-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Create a values.yaml key that HelmRelease can use via valuesFrom
        # Using same app as Grafana (shared app registration)
        values.yaml: |
          config:
            oidc:
              clientID: "{{ .headlampClientId }}"
              clientSecret: "{{ .headlampClientSecret }}"
              issuerURL: "https://login.microsoftonline.com/{{ .azureTenantId }}/v2.0"
              validatorIssuerURL: "https://sts.windows.net/{{ .azureTenantId }}/"
              validatorClientID: "{{ .aksApiServerClientId }}"
              scopes: "{{ .aksApiServerClientId }}/.default,openid,email,profile"
  
  # Data to fetch from Azure Key Vault
  data:
    - secretKey: headlampClientId
      remoteRef:
        key: headlamp-client-id
    
    - secretKey: headlampClientSecret
      remoteRef:
        key: headlamp-client-secret
    
    - secretKey: azureTenantId
      remoteRef:
        key: azure-tenant-id
    
    - secretKey: aksApiServerClientId
      remoteRef:
        key: aks-api-server-client-id

