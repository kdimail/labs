---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  wait: false  # Apps can be deployed independently
  timeout: 10m
  
  path: ./contoso/flux/applications/overlays/qa
  
  dependsOn:
    - name: platform-services
  
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-config
        optional: false
  
  sourceRef:
    kind: GitRepository
    name: qa-flux
    namespace: flux-system

