---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reloader-values
  namespace: flux-system
data:
  values.yaml: |
    reloader:
      watchGlobally: true
      ignoreNamespaces: "kube-system,flux-system"
      reloadStrategy: annotations
      reloadOnCreate: false
      reloadOnDelete: false
      resources:
        limits:
          cpu: 150m
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 128Mi
