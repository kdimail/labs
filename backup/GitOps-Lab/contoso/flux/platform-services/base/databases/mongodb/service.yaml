---
# ClusterIP Service for MongoDB
# Internal cluster access only - apps in cluster connect to: mongodb-svc.mongodb.svc.cluster.local:27017
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: mongodb
  labels:
    app: mongodb-instance
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app: mongodb-instance-svc  # Matches the label set by the MongoDB operator

