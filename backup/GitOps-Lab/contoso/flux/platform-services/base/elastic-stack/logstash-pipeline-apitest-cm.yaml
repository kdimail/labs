apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline-apitest
  namespace: elastic-stack
data:
  api-test-pipeline.conf: |
    input {
      http {
        port => 5045
        codec => "json"
      }
    }
    filter {
      # Add any filter logic here if needed
    }
    output {
      elasticsearch {
        hosts => ["$${PRODUCTION_ES_HOSTS}"]
        index => "contoso-api-test-%{+YYYY.MM}"
        user => "$${PRODUCTION_ES_USER}"
        password => "$${PRODUCTION_ES_PASSWORD}"
        ssl => true
        cacert => "$${PRODUCTION_ES_SSL_CERTIFICATE_AUTHORITY}"
      }
    }
