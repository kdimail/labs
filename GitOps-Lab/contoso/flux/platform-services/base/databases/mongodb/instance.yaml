---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb-instance
  namespace: mongodb
spec:
  members: 1
  type: ReplicaSet
  version: "7.0.5"
  
  security:
    authentication:
      modes: ["SCRAM"]
  
  users:
    - name: admin
      db: admin
      passwordSecretRef:
        name: mongodb-admin-password
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
        - name: readWriteAnyDatabase
          db: admin
        - name: dbAdminAnyDatabase
          db: admin
      scramCredentialsSecretName: mongodb-admin-scram
  
  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            storageClassName: managed-premium-sc-tags
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
        - metadata:
            name: logs-volume
          spec:
            storageClassName: managed-premium-sc-tags
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi  # Logs typically need less space
      
      template:
        spec:
          containers:
            - name: mongod
              resources:
                requests:
                  memory: 512Mi
                  cpu: 250m
                limits:
                  memory: 2Gi
                  cpu: 1000m
            - name: mongodb-agent
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 500m
# ExternalSecret for MongoDB admin password
# The actual Secret is created by External Secrets Operator
# Password is fetched from Azure Key Vault (see externalsecret.yaml)
