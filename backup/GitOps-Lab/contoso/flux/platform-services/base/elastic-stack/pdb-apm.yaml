---
# Pod Disruption Budget for APM Server
# Ensures high availability during voluntary disruptions (node drains, updates, etc.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: production-apm-pdb
  namespace: elastic-stack
  labels:
    app: apm-server
spec:
  maxUnavailable: 1  # non-prod runs 1 replica; minAvailable would block node drains
  selector:
    matchLabels:
      apm.k8s.elastic.co/name: production-apm
