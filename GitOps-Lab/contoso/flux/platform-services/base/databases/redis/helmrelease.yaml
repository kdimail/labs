---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-ha
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: redis
  
  install:
    createNamespace: true
    crds: Create
    timeout: 10m
    remediation:
      retries: 3
  
  upgrade:
    crds: CreateReplace
    timeout: 10m
    remediation:
      retries: 3
      remediateLastFailure: true
  
  chart:
    spec:
      chart: redis-ha
      version: ">=4.26.0"
      sourceRef:
        kind: HelmRepository
        name: dandydeveloper
        namespace: flux-system
      interval: 12h
  
  valuesFrom:
    - kind: ConfigMap
      name: redis-ha-values
      valuesKey: values.yaml
    - kind: Secret
      name: redis-ha-credentials
      valuesKey: redisPassword
      targetPath: auth.redisPassword

