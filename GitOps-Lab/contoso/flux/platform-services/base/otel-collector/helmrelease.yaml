---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: open-telemetry
  install:
    createNamespace: true
    timeout: 10m
  upgrade:
    crds: CreateReplace
    timeout: 10m
    remediation:
      remediateLastFailure: true

  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.159.0"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
      interval: 87600h

  valuesFrom:
    - kind: ConfigMap
      name: otel-collector-values
      valuesKey: values.yaml
