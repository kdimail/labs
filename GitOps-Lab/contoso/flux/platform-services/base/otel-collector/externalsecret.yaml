apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apm-server-credentials
  namespace: open-telemetry
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: apm-server-credentials
    creationPolicy: Owner
  data:
    - secretKey: secret-token
      remoteRef:
        key: shared-nonprod-contoso-elasticapm-secrettoken
