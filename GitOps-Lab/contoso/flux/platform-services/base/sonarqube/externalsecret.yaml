---
# External Secret for PostgreSQL database credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-db-credentials
  namespace: sonarqube
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: sonarqube-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: shared-nonprod-contoso-sonarqube-db-password
    - secretKey: username
      remoteRef:
        key: shared-nonprod-contoso-sonarqube-db-username
---
# External Secret for SonarQube admin credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-admin-credentials
  namespace: sonarqube
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: sonarqube-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: systemPasscode
      remoteRef:
        key: shared-nonprod-contoso-sonarqube-system-passcode
---
# External Secret for SonarQube OIDC credentials (Entra ID integration)
# Produces a K8s secret with a 'secret.properties' key consumed by sonarSecretKey.
# The properties file format is required by SonarQube's sonarSecretKey mechanism.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-oidc-credentials
  namespace: sonarqube
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: sonarqube-oidc-credentials
    creationPolicy: Owner
    template:
      data:
        sonar-secret.txt: |
          sonar.auth.oidc.clientSecret={{ .clientSecret }}
          sonar.auth.oidc.clientId={{ .clientId }}
          sonar.auth.oidc.issuerId={{ .issuerId }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: shared-nonprod-contoso-sonarqube-oidc-client-secret
    - secretKey: clientId
      remoteRef:
        key: shared-nonprod-contoso-sonarqube-oidc-client-id
    - secretKey: issuerId
      remoteRef:
        key: shared-nonprod-contoso-sonarqube-oidc-issuer-id
