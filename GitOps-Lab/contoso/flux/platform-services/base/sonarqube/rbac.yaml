---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app: sonarqube
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/instance: sonarqube
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonarqube-admin
  labels:
    app: sonarqube
    app.kubernetes.io/name: sonarqube
subjects:
  - kind: ServiceAccount
    name: sonarqube
    namespace: sonarqube
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# Role for SonarQube - minimal permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app: sonarqube
    app.kubernetes.io/name: sonarqube
rules:
  # Allow reading own configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading own secrets (for database credentials)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
# RoleBinding for SonarQube ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app: sonarqube
    app.kubernetes.io/name: sonarqube
subjects:
  - kind: ServiceAccount
    name: sonarqube
    namespace: sonarqube
roleRef:
  kind: Role
  name: sonarqube
  apiGroup: rbac.authorization.k8s.io
---
# Role for PostgreSQL - minimal permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sonarqube-postgresql
  namespace: sonarqube
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
rules:
  # Allow reading database credentials
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sonarqube-db-credentials"]
    verbs: ["get"]
---
# RoleBinding for PostgreSQL ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonarqube-postgresql
  namespace: sonarqube
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
subjects:
  - kind: ServiceAccount
    name: sonarqube-postgresql
    namespace: sonarqube
roleRef:
  kind: Role
  name: sonarqube-postgresql
  apiGroup: rbac.authorization.k8s.io
