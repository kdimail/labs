apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
  namespace: elastic-stack
data:
  logging-pipeline.conf: |
    input {
      http {
        port => 5046
        codec => "json"
        max_content_length => 104857600
      }
    }
    filter {
      # Add any filter logic here if needed
    }
    output {
      elasticsearch {
        hosts => ["$${PRODUCTION_ES_HOSTS}"]
        index => "contoso-logs-%{+YYYY.MM}"
        user => "$${PRODUCTION_ES_USER}"
        password => "$${PRODUCTION_ES_PASSWORD}"
        ssl => true
        cacert => "$${PRODUCTION_ES_SSL_CERTIFICATE_AUTHORITY}"
      }
    }

  api-performance-pipeline.conf: |
    input {
      http {
        port => 5047
        codec => "json"
        max_content_length => 104857600
      }
    }
    filter {
      # Add any filter logic here if needed
    }
    output {
      elasticsearch {
        hosts => ["$${PRODUCTION_ES_HOSTS}"]
        index => "contoso-performance-test-%{+YYYY.MM}"
        user => "$${PRODUCTION_ES_USER}"
        password => "$${PRODUCTION_ES_PASSWORD}"
        ssl => true
        cacert => "$${PRODUCTION_ES_SSL_CERTIFICATE_AUTHORITY}"
      }
    }

  api-test-pipeline.conf: |
    input {
      http {
        port => 5045
        codec => "json"
      }
    }
    filter {
      # Add any filter logic here if needed
    }
    output {
      elasticsearch {
        hosts => ["$${PRODUCTION_ES_HOSTS}"]
        index => "contoso-api-test-%{+YYYY.MM}"
        user => "$${PRODUCTION_ES_USER}"
        password => "$${PRODUCTION_ES_PASSWORD}"
        ssl => true
        cacert => "$${PRODUCTION_ES_SSL_CERTIFICATE_AUTHORITY}"
      }
    }

