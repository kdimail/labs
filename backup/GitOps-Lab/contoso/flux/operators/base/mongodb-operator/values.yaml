---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-values
  namespace: flux-system
data:
  values.yaml: |
    ## MongoDB Community Operator Configuration
    ## Official MongoDB Community Kubernetes Operator
    
    ## Operator deployment settings
    operator:
      # Namespace to watch (empty = all namespaces)
      watchNamespace: "mongodb"
    
    ## Resource limits for operator
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    
    ## Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 2000
    
    ## MongoDB instance defaults
    ## These are applied to all MongoDB instances managed by this operator
    mongodb:
      # Default storage class for all MongoDB instances
      storageClass: managed-premium-sc-tags

