---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DO NOT set a global namespace - it causes cross-namespace reference issues:
# - GitRepository and HelmRelease must be in flux-system
# - ConfigMap (values) must be in flux-system (HelmRelease reads from same namespace)
# - ExternalSecret must be in flux-system (target Secret read by HelmRelease)
# - Namespace is cluster-scoped (no namespace field)
# Each resource file explicitly declares its own namespace.

resources:
  - externalsecret.yaml
  - values.yaml
  - restheart-helmrelease.yaml
