---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  wait: true
  timeout: 10m
  
  path: ./contoso/flux/infrastructure/overlays/qa
  
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-config
        optional: false
  
  sourceRef:
    kind: GitRepository
    name: qa-flux
    namespace: flux-system
  
  # Health check removed: CRD is created by the Helm chart
  # The Kustomization will be Ready when the HelmRelease is applied

