apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-operator-config
  namespace: cnpg-system
data:
  values.yaml: |
    # Example configuration values for the Postgres Operator
    replicaCount: 1

    # image:
    #   repository: "cloudnative/postgres-operator"
    #   tag: "v1.13.0"
    #   pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"

    monitoring:
      podMonitorEnabled: true
      serviceMonitorEnabled: true
      grafanaDashboard:
        create: False
        
    nodeSelector: {}
    tolerations: []
    affinity: {}