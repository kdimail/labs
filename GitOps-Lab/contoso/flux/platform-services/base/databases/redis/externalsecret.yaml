---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-ha-credentials
  namespace: flux-system
spec:
  refreshInterval: 5m
  
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  
  target:
    name: redis-ha-credentials
    creationPolicy: Owner
  
  data:
    - secretKey: redisPassword
      remoteRef:
        key: redis-password

