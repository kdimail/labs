---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    helm.toolkit.fluxcd.io/force: 'true'
  name: headlamp
  namespace: flux-system
spec:
  interval: 1m
  chart:
    spec:
      chart: headlamp
      # version: '1.15.x'
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 12h
  targetNamespace: headlamp
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    force: true
  # Values can be overridden via valuesFrom in environment-specific configurations
  # values: {}
  valuesFrom:
    # Base configuration from ConfigMap
    - kind: ConfigMap
      name: headlamp-values
      valuesKey: values.yaml
    # OIDC credentials from ExternalSecret (will merge/override config.oidc.clientID and clientSecret)
    - kind: Secret
      name: headlamp-oidc-secret
      valuesKey: values.yaml

