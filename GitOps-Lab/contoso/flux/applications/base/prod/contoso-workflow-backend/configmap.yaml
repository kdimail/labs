apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-api-config
  namespace: contoso
  labels:
    app: contoso-workflow-backend
    service: workflow
data:
  CommandTelemetry__ActivitySourceName: Workflow.Commands
  CommandTelemetry__MeterName: Workflow.Commands
  CommandTelemetry__MeterVersion: "1.0.0"
  ElasticApm__ServiceName: Contoso.Workflow.Backend
  Logging__LogLevel__Contoso.Workflow.Backend: Debug
  OpenTelemetry__ServiceName: Contoso.Workflow.Backend
  Pagination__DefaultPageSize: "50"
  Pagination__MaxPageSize: "1000"
  Performance__CommandTimeout: "30"
  Performance__MaxRetryCount: "3"
  Performance__QueryTimeout: "180"
  Serilog__InfluxDb__ApplicationName: workflowService
  Serilog__InfluxDb__InstanceName: production
  ServiceName: Contoso.Workflow.Backend.Api
  Serilog__MinimumLevel__Override__Contoso.Workflow.Backend.Api: Debug
  Serilog__MinimumLevel__Override__Contoso.Workflow.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.Workflow.Backend.Infrastructure: Debug
  Cache__workflowDetails__TTL: '300'
  Cache__workflowHeaders__TTL: '300'
  Cache__Suppliers__TTL: '3600'
  ExportOptions__DefaultDomainName: workflow
  Export__AllowedDomains__0: workflow
  Export__AllowedDomains__1: api
  Export__EnableCsvExport: 'true'
  Export__EnableExcelExport: 'true'
  Export__EnablePdfExport: 'true'
  Export__MaxExportSize: '50000'
  FeatureFlags__EnableAdvancedFiltering: 'true'
  FeatureFlags__EnableBulkOperations: 'true'
  FeatureFlags__EnableExport: 'true'
  FeatureFlags__EnablePromiseDateAudit: 'true'
  ServiceBus__QueueName: excel-export-queue
