---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-azure-ad-creds
  namespace: monitoring
spec:
  # Refresh interval - how often to check for updates in Key Vault
  refreshInterval: 5m
  
  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  
  # Target secret to create in Kubernetes
  target:
    name: grafana-azure-ad-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Grafana Azure AD OAuth configuration
        GF_AUTH_AZUREAD_CLIENT_ID: "{{ .grafanaClientId }}"
        GF_AUTH_AZUREAD_CLIENT_SECRET: "{{ .grafanaClientSecret }}"
        GF_AUTH_AZUREAD_TENANT_ID: "{{ .azureTenantId }}"
        GF_AUTH_AZUREAD_AUTH_URL: "https://login.microsoftonline.com/{{ .azureTenantId }}/oauth2/v2.0/authorize"
        GF_AUTH_AZUREAD_TOKEN_URL: "https://login.microsoftonline.com/{{ .azureTenantId }}/oauth2/v2.0/token"
        # Grafana Admin Credentials
        admin-user: "admin"
        GRAFANA_ADMIN_PASSWORD: "{{ .grafanaAdminPassword }}"
        # Azure AD Group Role Mapping
        # GF_AUTH_AZUREAD_ROLE_ATTRIBUTE_PATH: "(contains(groups[*], '{{ .grafanaAdminGroupId }}') && 'Admin') || (contains(groups[*], '{{ .grafanaEditorGroupId }}') && 'Editor') || 'Viewer'"
        GF_AUTH_AZUREAD_ROLE_ATTRIBUTE_PATH: "{{ .grafanaAdminGroupId }}:1:Admin {{ .grafanaEditorGroupId }}:1:Editor {{ .grafanaViewerGroupId }}:1:Viewer"
    
  
  # Data to fetch from Azure Key Vault
  data:
    - secretKey: grafanaClientId
      remoteRef:
        key: grafana-client-id
    
    - secretKey: grafanaClientSecret
      remoteRef:
        key: grafana-client-secret
    
    - secretKey: azureTenantId
      remoteRef:
        key: azure-tenant-id
    
    - secretKey: grafanaAdminPassword
      remoteRef:
        key: grafana-admin-password
    
    - secretKey: grafanaAdminGroupId
      remoteRef:
        key: grafana-admin-group-id
    
    - secretKey: grafanaEditorGroupId
      remoteRef:
        key: grafana-editor-group-id
    
    - secretKey: grafanaViewerGroupId
      remoteRef:
        key: grafana-viewer-group-id