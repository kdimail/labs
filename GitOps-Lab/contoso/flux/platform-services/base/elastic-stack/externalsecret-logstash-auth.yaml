apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: logstash-basic-auth
  namespace: elastic-stack
spec:
  refreshInterval: 5m
  
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  
  target:
    name: logstash-basic-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The auth file should contain htpasswd format: username:hashed-password
        auth: "{{ .logstashBasicAuth | b64dec }}"
  
  data:
    - secretKey: logstashBasicAuth
      remoteRef:
        key: shared-nonprod-contoso-logstash-basic-auth-htpasswd
