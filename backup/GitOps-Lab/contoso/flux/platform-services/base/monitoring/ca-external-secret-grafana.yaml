---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssl-contoso-grp-com-tls
  namespace: monitoring
spec:
  refreshInterval: 5m
  
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  
  target:
    name: ssl-contoso-grp-com-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        # Base64 decode the values from Key Vault
        tls.crt: "{{ .sslCert | b64dec }}"
        tls.key: "{{ .sslKey | b64dec }}"
  
  data:
    - secretKey: sslCert
      remoteRef:
        key: cloud-ssl-contoso-grp-com-cert
    - secretKey: sslKey
      remoteRef:
        key: cloud-ssl-contoso-grp-com-key