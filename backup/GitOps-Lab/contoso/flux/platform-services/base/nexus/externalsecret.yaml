# Nexus admin credentials from Azure Key Vault (production: no plaintext passwords in Git).
# Create secret in KV: shared-nonprod-contoso-nexus-admin-password (strong, generated value).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-admin-credentials
  namespace: nexus
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: nexus-admin-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        NEXUS_SECURITY_RANDOMPASSWORD: "false"
        NEXUS_SECURITY_INITIAL_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: shared-nonprod-contoso-nexus-admin-password
