---
# ExternalSecret for Flux GitRepository SSH Authentication
# This ExternalSecret fetches git credentials from Azure Key Vault
# and creates the git-creds secret used by GitRepository resources
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-creds
  namespace: contoso
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore      # or ClusterSecretStore
  target:
    name: git-creds
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: identity
      remoteRef:
        key: flux-git-ssh-private-key
    - secretKey: known_hosts
      remoteRef:
        key: flux-git-ssh-known-hosts
