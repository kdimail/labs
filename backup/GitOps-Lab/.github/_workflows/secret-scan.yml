name: Secret Scanning

on:
  push:
    branches:
#      - main
#      - new-il
       - dev
#  pull_request:
#    branches:
#      - main

jobs:
  scan-secrets:
    name: Scan for Secrets and Sensitive Data
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Needed to resolve commit range for incremental scan
      
      - name: Install Gitleaks
        run: |
          # Download and install Gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/ || mv gitleaks /tmp/gitleaks
          export PATH="/tmp:$PATH"
          gitleaks version
      
      - name: Run Gitleaks Scan
        id: gitleaks
        continue-on-error: true
        run: |
          echo "Running Gitleaks secret scan..."
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="HEAD~1..HEAD"
          else
            LOG_OPTS="$BEFORE..$SHA"
          fi
          echo "Scanning commit range: $LOG_OPTS"
          if gitleaks detect --source . --log-opts "$LOG_OPTS" --report-path gitleaks-report.json --report-format json --verbose; then
            echo "scan_result=passed" >> $GITHUB_OUTPUT
            echo "✅ No secrets detected"
          else
            echo "scan_result=failed" >> $GITHUB_OUTPUT
            echo "❌ Secrets detected!"
            exit 1
          fi
                
      - name: Install jq for JSON parsing
        if: steps.gitleaks.outputs.scan_result == 'failed'
        run: |
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update -qq && sudo apt-get install -y -qq jq || {
              echo "Failed to install via apt, trying alternative method..."
              wget -q https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -O /tmp/jq
              chmod +x /tmp/jq
              sudo mv /tmp/jq /usr/local/bin/jq || mv /tmp/jq /tmp/jq-bin
              export PATH="/tmp:$PATH"
            }
          fi
          jq --version
      
      - name: Display Scan Results
        if: steps.gitleaks.outputs.scan_result == 'failed'
        run: |
          echo "========================================"
          echo "🔍 GITLEAKS SCAN RESULTS"
          echo "========================================"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "========================================"
          if [ -f gitleaks-report.json ]; then
            # Try to parse with jq if available, otherwise show raw JSON
            if command -v jq &> /dev/null || [ -f /tmp/jq-bin ]; then
              JQ_CMD=$(command -v jq || echo "/tmp/jq-bin")
              $JQ_CMD -r '.[] | "File: \(.File)\nLine: \(.StartLine)\nSecret: \(.Secret | .[0:50])...\nRule: \(.RuleID)\n---"' gitleaks-report.json 2>/dev/null || {
                echo "Failed to parse JSON, showing raw report:"
                cat gitleaks-report.json
              }
            else
              echo "jq not available, showing raw report:"
              cat gitleaks-report.json
            fi
          fi
          echo "========================================"
      
      - name: Upload Gitleaks Report
        if: steps.gitleaks.outputs.scan_result == 'failed'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30
      
      - name: Success Summary
        if: steps.gitleaks.outputs.scan_result == 'passed'
        run: |
          echo "========================================"
          echo "✅ SECRET SCANNING PASSED"
          echo "========================================"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "No secrets or sensitive data detected!"
          echo ""
          echo "Your code is safe to commit and deploy."
          echo "========================================"
      
      - name: Comment on PR (if secrets found)
        if: steps.gitleaks.outputs.scan_result == 'failed' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Secret Scanning Failed
              
              ⚠️ **Potential secrets or sensitive data detected in this PR!**
              
              ### What to do:
              1. Review the Gitleaks scan results in the workflow logs
              2. Remove any secrets, passwords, API keys, or sensitive data
              3. Use environment variables or Azure Key Vault for secrets
              4. Update your commit and push again
              
              ### Common issues:
              - Hardcoded passwords or API keys
              - Private keys or certificates
              - AWS/Azure credentials
              - Database connection strings
              - Personal access tokens
              
              **This PR cannot be merged until all secrets are removed.**
              
              📥 Download the detailed report from the workflow artifacts for more information.
              
              ---
              *Scan performed by Gitleaks v8.18.1* 🔍`
            })
      
      - name: Fail job if secrets found
        if: steps.gitleaks.outputs.scan_result == 'failed'
        run: |
          echo "========================================"
          echo "❌ SECRET SCANNING FAILED"
          echo "========================================"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "Potential secrets or sensitive data were detected in your code."
          echo ""
          echo "Please review the scan results above and:"
          echo "  1. Remove any hardcoded secrets"
          echo "  2. Use environment variables or Key Vault"
          echo "  3. Update your commit"
          echo ""
          echo "Common patterns detected:"
          echo "  - API keys and tokens"
          echo "  - Passwords and credentials"
          echo "  - Private keys and certificates"
          echo "  - Database connection strings"
          echo ""
          echo "This commit is blocked until all secrets are removed."
          echo "========================================"
          exit 1

