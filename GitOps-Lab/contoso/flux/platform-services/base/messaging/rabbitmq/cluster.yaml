---
# RabbitMQ Cluster Instance
# Deployed by the RabbitMQ Cluster Operator
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  replicas: 1
  image: rabbitmq:3.13-management
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  persistence:
    storageClassName: managed-premium-sc-tags
    storage: 20Gi
  
  rabbitmq:
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_prometheus
      - rabbitmq_web_stomp
      - rabbitmq_web_mqtt
      - rabbitmq_stomp
      - rabbitmq_mqtt
      - rabbitmq_auth_backend_oauth2
    
    additionalConfig: |
      ## Performance tuning
      vm_memory_high_watermark.relative = 0.6
      disk_free_limit.absolute = 2GB
      
      ## WebSocket ports
      web_stomp.tcp.port = 15674
      web_mqtt.tcp.port = 15675
      
      ## Authentication - Azure AD OAuth2 + Internal fallback
      auth_backends.1 = oauth2
      auth_backends.2 = internal
      
      ## OAuth2 Configuration for Azure AD
      ## Values are injected via environment variables (OAUTH_CLIENT_ID, OAUTH_TENANT_ID)
      ## CRITICAL: Application ID URI must be set in Azure AD: api://{CLIENT_ID}
      ## These are set dynamically through init container or configMap templating
      auth_oauth2.additional_scopes_key = scp
      
      ## NOTE: OAuth users will need permissions configured manually via RabbitMQ Management UI
      ## Or use basic auth: username=admin, password from Key Vault (rabbitmq-admin-password)
      
      ## Management UI OAuth2 settings
      ## Both OAuth and basic auth (username/password) will be available
      management.oauth_enabled = true
      
      ## Allow both OAuth and basic auth logins
      management.disable_basic_auth = false
  
  service:
    type: ClusterIP
  
  override:
    statefulSet:
      spec:
        template:
          spec:
            # Init container to generate OAuth config from template
            initContainers:
              - name: generate-oauth-config
                image: busybox:latest
                command:
                  - sh
                  - -c
                  - |
                    echo "Generating OAuth configuration..."
                    envsubst < /tmp/oauth-config-template/oauth-config.conf.template > /tmp/rabbitmq-config/10-oauth.conf
                    echo "OAuth configuration generated successfully"
                    cat /tmp/rabbitmq-config/10-oauth.conf
                env:
                  - name: OAUTH_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: rabbitmq-azure-ad-creds
                        key: oauth-client-id
                  - name: OAUTH_TENANT_ID
                    valueFrom:
                      secretKeyRef:
                        name: rabbitmq-azure-ad-creds
                        key: oauth-tenant-id
                volumeMounts:
                  - name: oauth-config-template
                    mountPath: /tmp/oauth-config-template
                  - name: rabbitmq-oauth-config
                    mountPath: /tmp/rabbitmq-config
            
            volumes:
              - name: oauth-config-template
                configMap:
                  name: rabbitmq-oauth-config-template
              - name: rabbitmq-oauth-config
                emptyDir: {}
            
            containers:
              - name: rabbitmq
                volumeMounts:
                  - name: rabbitmq-oauth-config
                    mountPath: /etc/rabbitmq/conf.d/10-oauth.conf
                    subPath: 10-oauth.conf
                ports:
                  - name: amqp
                    containerPort: 5672
                    protocol: TCP
                  - name: management
                    containerPort: 15672
                    protocol: TCP
                  - name: prometheus
                    containerPort: 15692
                    protocol: TCP
                  - name: web-stomp
                    containerPort: 15674
                    protocol: TCP
                  - name: web-mqtt
                    containerPort: 15675
                    protocol: TCP
                env:
                  # Basic auth credentials (fallback when OAuth fails)
                  - name: RABBITMQ_DEFAULT_USER
                    value: admin
                  - name: RABBITMQ_DEFAULT_PASS
                    valueFrom:
                      secretKeyRef:
                        name: rabbitmq-azure-ad-creds
                        key: rabbitmq-password
                  
                  # OAuth2 credentials from Azure Key Vault (via ExternalSecret)
                  - name: OAUTH_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: rabbitmq-azure-ad-creds
                        key: oauth-client-id
                  - name: OAUTH_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: rabbitmq-azure-ad-creds
                        key: oauth-client-secret
                  - name: OAUTH_TENANT_ID
                    valueFrom:
                      secretKeyRef:
                        name: rabbitmq-azure-ad-creds
                        key: oauth-tenant-id
                  
                  # Constructed OAuth URLs (used by RabbitMQ config overlay)
                  - name: OAUTH_RESOURCE_SERVER_ID
                    value: "api://$(OAUTH_CLIENT_ID)"
                  - name: OAUTH_ISSUER
                    value: "https://login.microsoftonline.com/$(OAUTH_TENANT_ID)/v2.0"
                  - name: OAUTH_JWKS_URL
                    value: "https://login.microsoftonline.com/$(OAUTH_TENANT_ID)/discovery/v2.0/keys"
                  - name: OAUTH_PROVIDER_URL
                    value: "https://login.microsoftonline.com/$(OAUTH_TENANT_ID)/v2.0"
