apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: wild-tls
spec:
  # Explicit list of namespaces where the secret will be created
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - elastic-stack
            - monitoring
            - headlamp
            - default
            - sonarqube
            - nexus
            - contoso
            - mongodb
            - open-telemetry
            - centrifugo

  externalSecretSpec:
    refreshInterval: 5m
    secretStoreRef:
      name: azure-kv
      kind: ClusterSecretStore
    target:
      name: ssl-contoso-grp-com-tls
      creationPolicy: Owner
      template:
        type: kubernetes.io/tls
        data:
          tls.crt: "{{ .cert | b64dec | pkcs12cert }}"
          tls.key: "{{ .cert | b64dec | pkcs12key }}"
    data:
      - secretKey: cert
        remoteRef:
          key: contosogrp-cloud-pfx
          decodingStrategy: None
