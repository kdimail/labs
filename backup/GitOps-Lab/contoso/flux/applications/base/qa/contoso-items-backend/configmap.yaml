apiVersion: v1
kind: ConfigMap
metadata:
  name: items-api-config
  namespace: contoso
  labels:
    app: contoso-items-backend
    service: items
data:
  CommandTelemetry__ActivitySourceName: Items.Commands
  CommandTelemetry__MeterName: Items.Commands
  CommandTelemetry__MeterVersion: "1.0.0"
  ElasticApm__ServiceName: Contoso.Items.Backend
  Logging__LogLevel__Contoso.Items.Backend: Debug
  OpenTelemetry__ServiceName: Contoso.Items.Backend.Api
  Pagination__DefaultPageSize: "50"
  Pagination__MaxPageSize: "1000"
  Performance__CommandTimeout: "30"
  Performance__MaxRetryCount: "3"
  Performance__QueryTimeout: "180"
  Serilog__InfluxDb__ApplicationName: itemsService
  Serilog__InfluxDb__InstanceName: production
  ServiceName: Contoso.Items.Backend.Api
  Serilog__MinimumLevel__Override__Contoso.Items.Backend.Api: Debug
  Serilog__MinimumLevel__Override__Contoso.Items.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.Items.Backend.Infrastructure: Debug
  Cache__ItemsDetails__TTL: "300"
  Cache__ItemsHeaders__TTL: "300"
  Cache__Suppliers__TTL: "3600"
  ExportOptions__DefaultDomainName: items
  Export__AllowedDomains__0: items
  Export__AllowedDomains__1: api
  Export__EnableCsvExport: "true"
  Export__EnableExcelExport: "true"
  Export__EnablePdfExport: "true"
  Export__MaxExportSize: "50000"
  FeatureFlags__EnableAdvancedFiltering: "true"
  FeatureFlags__EnableBulkOperations: "true"
  FeatureFlags__EnableExport: "true"
  FeatureFlags__EnablePromiseDateAudit: "true"
  ServiceBus__QueueName: excel-export-queue
  Serilog__MinimumLevel__Override__Contoso.Workspace.Backend.Api: Debug
