---
# ExternalSecret for MongoDB admin password
# Fetches password from Azure Key Vault using External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-admin-password
  namespace: mongodb
spec:
  refreshInterval: 5m
  
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  
  target:
    name: mongodb-admin-password
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # MongoDB expects the password key to be named 'password'
        password: "{{ .mongodbAdminPassword }}"
  
  # Data to fetch from Azure Key Vault
  data:
    - secretKey: mongodbAdminPassword
      remoteRef:
        key: mongodb-admin-password
---
# ExternalSecret for mongo-express UI basic auth credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-express-ui-auth
  namespace: mongodb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: mongo-express-ui-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .mongoExpressUiUsername }}"
        password: "{{ .mongoExpressUiPassword }}"
  data:
    - secretKey: mongoExpressUiUsername
      remoteRef:
        key: mongo-express-ui-username
    - secretKey: mongoExpressUiPassword
      remoteRef:
        key: mongo-express-ui-password
