---
# ServiceAccount used by Flux helm-controller to manage the centrifugo HelmRelease
apiVersion: v1
kind: ServiceAccount
metadata:
  name: centrifugo
  namespace: centrifugo
  labels:
    app.kubernetes.io/name: centrifugo
    app.kubernetes.io/component: serviceaccount
---
# Bind centrifugo SA to cluster-admin so it can manage
# Helm release state (Secrets) and all resources deployed by the chart
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: centrifugo-admin
  namespace: centrifugo
  labels:
    app.kubernetes.io/name: centrifugo
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: centrifugo
    namespace: centrifugo
