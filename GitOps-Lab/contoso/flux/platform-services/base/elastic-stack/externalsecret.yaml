---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kibana-encryption-keys
  namespace: elastic-stack
spec:
  # Refresh every 24 hours for automated secret rotation
  refreshInterval: 5m
  
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  
  target:
    name: kibana-encryption-keys
    creationPolicy: Owner
  
  data:
    - secretKey: KIBANA_ENCRYPTION_KEY
      remoteRef:
        key: shared-nonprod-contoso-kibana-encryption-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apm-server-credentials
  namespace: elastic-stack
spec:
  # Refresh every 24 hours for automated secret rotation
  refreshInterval: 5m
  
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  
  target:
    name: apm-server-credentials
    creationPolicy: Owner
  
  data:
    - secretKey: secret-token
      remoteRef:
        key: shared-nonprod-contoso-elasticapm-secrettoken

