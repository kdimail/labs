apiVersion: v1
kind: ConfigMap
metadata:
  name: addresses-api-config
  namespace: contoso
  labels:
    app: contoso-addresses-backend
    service: addresses
data:
  CommandTelemetry__ActivitySourceName: Addresses.Commands
  CommandTelemetry__MeterName: Addresses.Commands
  CommandTelemetry__MeterVersion: "1.0.0"
  ElasticApm__ServiceName: Contoso.Addresses.Backend
  Logging__LogLevel__Contoso.Addresses.Backend: Information
  OpenTelemetry__ServiceName: Contoso.Addresses.Backend.Api
  Pagination__DefaultPageSize: "50"
  Pagination__MaxPageSize: "1000"
  Performance__CommandTimeout: "30"
  Performance__MaxRetryCount: "3"
  Performance__QueryTimeout: "180"
  Serilog__InfluxDb__ApplicationName: addressesService
  Serilog__InfluxDb__InstanceName: production
  ServiceName: Contoso.Addresses.Backend.Api
  Serilog__MinimumLevel__Override__Contoso.Addresses.Backend.Api: Information
  Serilog__MinimumLevel__Override__Contoso.Addresses.Backend.Application: Information
  Serilog__MinimumLevel__Override__Contoso.Addresses.Backend.Infrastructure: Information
  Cache__addressesDetails__TTL: "300"
  Cache__addressesHeaders__TTL: "300"
  Cache__Suppliers__TTL: "3600"
  ExportOptions__DefaultDomainName: addresses
  Export__AllowedDomains__0: addresses
  Export__AllowedDomains__1: api
  Export__EnableCsvExport: "true"
  Export__EnableExcelExport: "true"
  Export__EnablePdfExport: "true"
  Export__MaxExportSize: "50000"
  FeatureFlags__EnableAdvancedFiltering: "true"
  FeatureFlags__EnableBulkOperations: "true"
  FeatureFlags__EnableExport: "true"
  FeatureFlags__EnablePromiseDateAudit: "true"
  Logging__LogLevel__Contoso.addresses.Backend: Debug
  ServiceBus__QueueName: excel-export-queue
  Serilog__MinimumLevel__Override__Contoso.Workspace.Backend.Api: Debug
  Serilog__MinimumLevel__Override__Contoso.addresses.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.addresses.Backend.Infrastructure: Debug
