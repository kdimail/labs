apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contoso-secrets
  namespace: contoso
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: contoso-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__ContosoDB
      remoteRef:
        key: shared-nonprod-contoso-connectionstrings-contosodb
    - secretKey: ConnectionStrings__ContosoDBTest
      remoteRef:
        key: shared-nonprod-contoso-connectionstrings-contosodbtest
    - secretKey: ConnectionStrings__RedisConnStr
      remoteRef:
        key: shared-nonprod-contoso-connectionstrings-redisconnstr
    - secretKey: ElasticApm__SecretToken
      remoteRef:
        key: shared-nonprod-contoso-elasticapm-secrettoken
    - secretKey: Jwt__Audience
      remoteRef:
        key: shared-nonprod-contoso-jwt-audience
    - secretKey: Jwt__SecretJwtKey
      remoteRef:
        key: shared-nonprod-contoso-jwt-secretjwtkey
    - secretKey: Jwt__ValidIssuer
      remoteRef:
        key: shared-nonprod-contoso-jwt-validissuer
    - secretKey: OpenId__Authority
      remoteRef:
        key: shared-nonprod-contoso-openid-authority
    - secretKey: OpenId__ClientId
      remoteRef:
        key: shared-nonprod-contoso-openid-clientid
    - secretKey: OpenId__ClientIds__0
      remoteRef:
        key: shared-nonprod-contoso-openid-clientids-0
    - secretKey: OpenId__ClientIds__1
      remoteRef:
        key: shared-nonprod-contoso-openid-clientids-1
    - secretKey: Serilog__InfluxDb__OrganizationId
      remoteRef:
        key: shared-nonprod-contoso-serilog-influxdb-organizationid
    - secretKey: Serilog__InfluxDb__Token
      remoteRef:
        key: shared-nonprod-contoso-serilog-influxdb-token
    - secretKey: Serilog__InfluxDb__Uri
      remoteRef:
        key: shared-nonprod-contoso-serilog-influxdb-uri
    - secretKey: ConnectionStrings__GalDB2ConnStr
      remoteRef:
        key: ConnectionStrings--GalDB2ConnStr
    - secretKey: ConnectionStrings__BELGIUMGalDB2ConnStr
      remoteRef:
        key: ConnectionStrings--BELGIUMGalDB2ConnStr
    - secretKey: ConnectionStrings__BTSGGalDB2ConnStr
      remoteRef:
        key: ConnectionStrings--BTSGGalDB2ConnStr
    - secretKey: ConnectionStrings__INGERSOLLGalDB2ConnStr
      remoteRef:
        key: ConnectionStrings--INGERSOLLGalDB2ConnStr
    - secretKey: ConnectionStrings__ISRAELGalDB2ConnStr
      remoteRef:
        key: ConnectionStrings--ISRAELGalDB2ConnStr
    - secretKey: ConnectionStrings__JAPANGalDB2ConnStr
      remoteRef:
        key: ConnectionStrings--JAPANGalDB2ConnStr
    - secretKey: ConnectionStrings__KOREAGalDB2ConnStr
      remoteRef:
        key: ConnectionStrings--KOREAGalDB2ConnStr
    - secretKey: Redis__Permissions__EncryptionKey
      remoteRef:
        key: shared-nonprod-contoso-redis-permissions-encryption-key
    - secretKey: Export__BlobStorageConnectionString
      remoteRef:
        key: export-blobstorageconnectionstring
    - secretKey: ServiceBus__ConnectionString
      remoteRef:
        key: servicebus-connectionstring
    - secretKey: BlobStorage__ConnectionString
      remoteRef:
        key: export-blobstorageconnectionstring
    - secretKey: CentrifugoApiKey
      remoteRef:
        key: centrifugo-api-key