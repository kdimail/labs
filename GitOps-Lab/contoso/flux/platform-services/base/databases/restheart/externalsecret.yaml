---
# ExternalSecret fetches MongoDB URI and admin user document from Azure Key Vault
# and produces a Kubernetes Secret in flux-system containing Helm values overrides.
# The HelmRelease merges these values (second in valuesFrom) on top of the ConfigMap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restheart-secrets
  namespace: flux-system
spec:
  refreshInterval: 5m

  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore

  target:
    name: restheart-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # HelmRelease reads this key via valuesFrom; it deep-merges with the ConfigMap values.
        # Only sensitive fields are overridden here (connection-string, admin user document).
        # NOTE: Helm valuesFrom merges at the map level, so the full mongoRealmAuthenticator
        # block must be repeated here alongside the sensitive create-user-document override.
        values.yaml: |
          restHeartConfiguration:
            mclient:
              connection-string: "{{ .mongoUri }}"
            mongoRealmAuthenticator:
              enabled: true
              users-db: restheart
              users-collection: users
              prop-id: _id
              prop-password: password
              json-path-roles: $.roles
              bcrypt-hashed-password: true
              bcrypt-complexity: 12
              create-user: true
              cache-enabled: false
              cache-size: 1000
              cache-ttl: 60000
              cache-expire-policy: AFTER_WRITE
              create-user-document: '{{ .adminUserDocument }}'

  # Secrets fetched from Azure Key Vault
  data:
    # Full MongoDB connection string, e.g.:
    #   mongodb://user:pass@host:27017/restheart?authSource=admin
    - secretKey: mongoUri
      remoteRef:
        key: restheart-mongo-uri

    # JSON string for the initial admin user, e.g.:
    #   {"_id": "admin", "password": "$2a$12$<bcrypt-hash>", "roles": ["admin"]}
    - secretKey: adminUserDocument
      remoteRef:
        key: restheart-admin-user-document
