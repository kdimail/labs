---
# Ingress for RabbitMQ Management UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-management
  namespace: rabbitmq
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - rabbitmq-contoso-shared-non-prod.${domain_filter}
      secretName: rabbitmq-management-tls
  rules:
    - host: rabbitmq-contoso-shared-non-prod.${domain_filter}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672

