---
# ServiceAccount for Contoso applications
# Used by HelmRelease and application deployments
apiVersion: v1
kind: ServiceAccount
metadata:
  name: contoso
  namespace: contoso
  labels:
    app.kubernetes.io/name: contoso
    app.kubernetes.io/component: serviceaccount
---
# RoleBinding to grant namespace admin permissions to the ServiceAccount
# The 'admin' ClusterRole provides read/write access to most resources in the namespace
# including the ability to create and modify roles and rolebindings
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: contoso-admin
  namespace: contoso
  labels:
    app.kubernetes.io/name: contoso
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin  # Built-in ClusterRole with namespace admin permissions
subjects:
  - kind: ServiceAccount
    name: contoso
    namespace: contoso
