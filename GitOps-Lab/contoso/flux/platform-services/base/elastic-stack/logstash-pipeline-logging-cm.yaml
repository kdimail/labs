apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline-logging
  namespace: elastic-stack
data:
  logging-pipeline.conf: |
    input {
      http {
        port => 5046
        codec => "plain"
        max_content_length => 104857600
      }
    }
    filter {
      # Add any filter logic here if needed
    }
    output {
      elasticsearch {
        hosts => ["$${PRODUCTION_ES_HOSTS}"]
        index => "contoso-logs-%{+YYYY.MM}"
        user => "$${PRODUCTION_ES_USER}"
        password => "$${PRODUCTION_ES_PASSWORD}"
        ssl => true
        cacert => "$${PRODUCTION_ES_SSL_CERTIFICATE_AUTHORITY}"
      }
    }
