---
# ExternalSecret for RabbitMQ Azure AD OAuth credentials
# Uses the same app registration as Grafana
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-azure-ad-creds
  namespace: rabbitmq
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: rabbitmq-azure-ad-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # OAuth configuration for RabbitMQ
        oauth-client-id: "{{ .grafanaClientId }}"
        oauth-client-secret: "{{ .grafanaClientSecret }}"
        oauth-tenant-id: "{{ .azureTenantId }}"
        # RabbitMQ admin password
        rabbitmq-password: "{{ .rabbitmqAdminPassword }}"
        rabbitmq-erlang-cookie: "{{ .rabbitmqErlangCookie }}"
  data:
    - secretKey: grafanaClientId
      remoteRef:
        key: grafana-client-id
    - secretKey: grafanaClientSecret
      remoteRef:
        key: grafana-client-secret
    - secretKey: azureTenantId
      remoteRef:
        key: azure-tenant-id
    - secretKey: rabbitmqAdminPassword
      remoteRef:
        key: rabbitmq-admin-password
    - secretKey: rabbitmqErlangCookie
      remoteRef:
        key: rabbitmq-erlang-cookie

