apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-api-config
  namespace: contoso
  labels:
    app: contoso-pricing-backend
    service: pricing
data:
  CommandTelemetry__ActivitySourceName: Pricing.Commands
  CommandTelemetry__MeterName: Pricing.Commands
  CommandTelemetry__MeterVersion: "1.0.0"
  ElasticApm__ServiceName: Contoso.Pricing.Backend
  Logging__LogLevel__Contoso.Pricing.Backend: Debug
  OpenTelemetry__ServiceName: Contoso.Pricing.Backend
  Pagination__DefaultPageSize: "50"
  Pagination__MaxPageSize: "1000"
  Performance__CommandTimeout: "30"
  Performance__MaxRetryCount: "3"
  Performance__QueryTimeout: "180"
  Serilog__InfluxDb__ApplicationName: pricingService
  Serilog__InfluxDb__InstanceName: production
  ServiceName: Contoso.Pricing.Backend.Api
  Serilog__MinimumLevel__Override__Contoso.Pricing.Backend.Api: Debug
  Serilog__MinimumLevel__Override__Contoso.Pricing.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.Pricing.Backend.Infrastructure: Debug
  Cache__pricingDetails__TTL: '300'
  Cache__pricingHeaders__TTL: '300'
  Cache__Suppliers__TTL: '3600'
  ExportOptions__DefaultDomainName: pricing
  Export__AllowedDomains__0: pricing
  Export__AllowedDomains__1: api
  Export__EnableCsvExport: 'true'
  Export__EnableExcelExport: 'true'
  Export__EnablePdfExport: 'true'
  Export__MaxExportSize: '50000'
  FeatureFlags__EnableAdvancedFiltering: 'true'
  FeatureFlags__EnableBulkOperations: 'true'
  FeatureFlags__EnableExport: 'true'
  FeatureFlags__EnablePromiseDateAudit: 'true'
  ServiceBus__QueueName: excel-export-queue
