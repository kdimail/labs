---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-grafana
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: monitoring
  install:
    createNamespace: true
    crds: Create
    timeout: 15m  # Increased timeout for Grafana pods that take longer to start
  upgrade:
    crds: CreateReplace
    timeout: 15m  # Increased timeout for Grafana pods that take longer to start
    remediation:
      remediateLastFailure: true

  chart:
    spec:
      chart: kube-prometheus-stack
      # STRICT SEMVER: Do not include 'v' prefix for chart versions
      version: "87.1.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-grafana
        namespace: flux-system
      interval: 87600h

  # Loads values from a ConfigMap in the flux-system namespace
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-grafana-values
      valuesKey: values.yaml
