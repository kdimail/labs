---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: centrifugo-external-secret
  namespace: centrifugo
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: centrifugo-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        CENTRIFUGO_HTTP_API_KEY: "{{ .api_key }}"
        CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "{{ .token_hmac_secret_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: centrifugo-api-key
    - secretKey: token_hmac_secret_key
      remoteRef:
        key: centrifugo-token-hmac-secret-key
