apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-api-config
  namespace: contoso
  labels:
    app: contoso-crm-backend
    service: crm
data:
  CommandTelemetry__ActivitySourceName: CRM.Commands
  CommandTelemetry__MeterName: CRM.Commands
  CommandTelemetry__MeterVersion: "1.0.0"
  ElasticApm__ServiceName: Contoso.CRM.Backend
  Logging__LogLevel__Contoso.CRM.Backend: Debug
  OpenTelemetry__ServiceName: Contoso.CRM.Backend.Api
  Pagination__DefaultPageSize: "50"
  Pagination__MaxPageSize: "1000"
  Performance__CommandTimeout: "30"
  Performance__MaxRetryCount: "3"
  Performance__QueryTimeout: "180"
  Serilog__InfluxDb__ApplicationName: crmService
  Serilog__InfluxDb__InstanceName: production
  ServiceName: Contoso.CRM.Backend.Api
  Serilog__MinimumLevel__Override__Contoso.CRM.Backend.Api: Debug
  Serilog__MinimumLevel__Override__Contoso.CRM.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.CRM.Backend.Infrastructure: Debug
  Cache__crmDetails__TTL: "300"
  Cache__crmHeaders__TTL: "300"
  Cache__Suppliers__TTL: "3600"
  ExportOptions__DefaultDomainName: crm
  Export__AllowedDomains__0: crm
  Export__AllowedDomains__1: api
  Export__EnableCsvExport: "true"
  Export__EnableExcelExport: "true"
  Export__EnablePdfExport: "true"
  Export__MaxExportSize: "50000"
  FeatureFlags__EnableAdvancedFiltering: "true"
  FeatureFlags__EnableBulkOperations: "true"
  FeatureFlags__EnableExport: "true"
  FeatureFlags__EnablePromiseDateAudit: "true"
  Logging__LogLevel__Contoso.crm.Backend: Debug
  ServiceBus__QueueName: excel-export-queue
  Serilog__MinimumLevel__Override__Contoso.Workspace.Backend.Api: Debug
  Serilog__MinimumLevel__Override__Contoso.crm.Backend.Application: Debug
  Serilog__MinimumLevel__Override__Contoso.crm.Backend.Infrastructure: Debug
