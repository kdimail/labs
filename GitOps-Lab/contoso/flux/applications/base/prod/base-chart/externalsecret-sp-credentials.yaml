apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sp-credentials
  namespace: contoso
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: sp-credentials
    creationPolicy: Owner
  data:
    - secretKey: AZURE_TENANT_ID
      remoteRef:
        key: azure-tenant-id
    - secretKey: AZURE_CLIENT_ID
      remoteRef:
        key: azure-client-id
    - secretKey: AZURE_CLIENT_SECRET
      remoteRef:
        key: azure-client-secret
