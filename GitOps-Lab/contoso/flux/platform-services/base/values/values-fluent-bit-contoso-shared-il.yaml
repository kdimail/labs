---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-values
  namespace: flux-system
data:
  values.yaml: |
    image:
      repository: cr.fluentbit.io/fluent/fluent-bit
      tag: 3.0.2

    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1

    resources:
      requests:
        cpu: 15m
        memory: 145M
      limits:
        cpu: 15m
        memory: 145M

    tolerations:
      - operator: Exists

    podSecurityContext:
      runAsUser: 0

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - DAC_READ_SEARCH

    serviceMonitor:
      enabled: true
      namespace: logging
      interval: 30s
      additionalLabels:
        release: prometheus-grafana

    prometheusRule:
      enabled: false

    metricsPort: 2020

    service:
      type: ClusterIP
      port: 2020
      labels:
        app: fluent-bit

    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: CLUSTER_NAME
        value: "ilc-shared-non-prod"
      - name: ENVIRONMENT
        value: "shared-non-prod"

    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 5
            Log_Level info
            Parsers_File parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
            Health_Check On

      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 5MB
            Skip_Long_Lines On
            Skip_Empty_Lines On
            Refresh_Interval 10
            Rotate_Wait 30
            DB /var/log/flb_kube.db

      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Kube_URL https://kubernetes.default.svc:443
            Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
            Kube_Tag_Prefix kube.var.log.containers.
            Merge_Log On
            Keep_Log Off
            K8S-Logging.Parser On
            K8S-Logging.Exclude Off
            Annotations Off
            Labels On
            Buffer_Size 256KB
            Use_Kubelet Off
            Kube_Meta_Cache_TTL 60s

        [FILTER]
            Name modify
            Match kube.*
            Add cluster_name ilc-shared-non-prod
            Add environment shared-non-prod
            Add log_source fluent-bit

        [FILTER]
            Name nest
            Match kube.*
            Operation lift
            Nested_under kubernetes
            Add_prefix k8s_

        [FILTER]
            Name modify
            Match kube.*
            Rename log message
            Remove stream
            Remove time

        [FILTER]
            Name grep
            Match kube.*
            Exclude k8s_pod_name ^fluent-bit-.*

      outputs: |
        [OUTPUT]
            Name http
            Match kube.*
            Host production-ls-ls-logs.elastic-stack.svc.cluster.local
            Port 5046
            URI /
            Format json
            Json_date_key @timestamp
            Json_date_format iso8601
            Header Content-Type application/json
            Retry_Limit 5
            Workers 1
            Compress gzip

    volumeMounts:
      - name: varlog
        mountPath: /var/log
      - name: varlibdockercontainers
        mountPath: /var/lib/docker/containers
        readOnly: true
      - name: etcmachineid
        mountPath: /etc/machine-id
        readOnly: true

    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: etcmachineid
        hostPath:
          path: /etc/machine-id
          type: FileOrCreate

    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "2020"
      prometheus.io/path: /api/v1/metrics/prometheus

    podLabels:
      app: fluent-bit
      version: 3.0.2

    livenessProbe:
      httpGet:
        path: /
        port: 2020
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /api/v1/health
        port: 2020
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

    priorityClassName: ""
    affinity: {}
    nodeSelector: {}

